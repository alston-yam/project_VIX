# ---------------------------------------------------------------------------
# VRP S&P 500 project: every parameter used by the pipeline lives here.
# Paths are relative to the repository root.
# ---------------------------------------------------------------------------

project:
  name: "S&P 500 Variance Risk Premium: Is the VIX Too Pessimistic?"
  version: "v2-stats"

dates:
  # Download window. Starts early so the first in-sample return exists, ends
  # after 2025 so the December 2025 forward window can complete.
  download_start: "1989-11-01"
  download_end: "2026-03-31"        # inclusive
  # Monthly sample window (months, inclusive).
  sample_start_month: "1990-01"
  sample_end_month: "2025-12"
  # Benchmark comparison window used in the sanity summary.
  benchmark_start: "1990-01-01"
  benchmark_end: "2024-12-31"
  # Date the current (SPX-options, model-free) VIX methodology went live.
  vix_new_methodology_date: "2003-09-22"

features:
  window: 21                 # trading days in the realised-variance window
  annualisation: 252         # trading days per year
  selloff_threshold_log: -0.05   # spx_fwd21_ret_log below this => is_selloff
  n_deciles: 10

sources:
  vix:
    provider: "Cboe via FRED"
    series_id: "VIXCLS"
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS"
    required: true
  vxo:
    provider: "Cboe via FRED"
    series_id: "VXOCLS"
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VXOCLS"
    required: false
  usrec:
    provider: "NBER via FRED"
    series_id: "USREC"
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=USREC"
    required: false
  spx:
    provider: "Yahoo Finance via yfinance"
    ticker: "^GSPC"
    auto_adjust: true
    fallback_provider: "Stooq via pandas_datareader"
    fallback_ticker: "^SPX"
    required: true

download:
  max_tries: 3
  backoff_base_seconds: 5     # waits 5s, then 10s between tries
  http_timeout_seconds: 60

checks:
  vix_min: 5.0
  vix_max: 100.0
  extreme_abs_log_return: 0.10
  max_calendar_gap_days: 4
  expected_max_vix_close: 82.69
  expected_max_vix_date: "2020-03-16"
  expected_monthly_rows: 432
  benchmark_mean_vix: 19.6
  benchmark_mean_rv: 15.5
  benchmark_tolerance_vol_pts: 1.0   # |ours - benchmark| <= this => ✅

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  figures: "outputs/figures"
  reports: "outputs/reports"
  logs: "logs"
  events_docs: "docs/events.md"

plots:
  dpi: 150
  formats: ["png", "svg"]
  source_note: "Data: Cboe via FRED (VIXCLS); S&P 500 via Yahoo Finance"
  # Events shaded on time-series charts, with the short label drawn for each.
  shade_events:
    ltcm_1998: "LTCM"
    sep11_2001: "9/11"
    gfc_2008: "GFC"
    us_downgrade_2011: "US downgrade"
    china_deval_2015: "China deval."
    volmageddon_2018: "Volmageddon"
    covid_2020: "COVID"
    tariff_2025: "Tariffs"
  headroom: 1.3   # y-axis top = data max x headroom, leaving space for event labels
  n_label_worst: 5

# ---------------------------------------------------------------------------
# v2: statistical tests (src/vrp/stats.py, `make stats`)
# ---------------------------------------------------------------------------
stats:
  alpha: 0.05                    # two-sided significance level; CIs are (1 - alpha)
  nw_lags_monthly: 6             # Newey–West (Bartlett) lags for monthly data (Carr & Wu)
  nw_lags_daily: 30              # for overlapping daily windows (21-day overlap; Carr & Wu use 30)
  n_exclude_worst: 5             # "mean excluding the worst N months"
  tail_sigma: 3.0                # count months below mean - k*sd vs a normal distribution
  win_rate_null: 0.5             # H0 for the win-rate test
  loss_share_null_decile: 0.10   # H0: worst-decile months carry 10% of losses (no clustering)
  worst_decile: 1                # selloff_decile label for the worst 10% of S&P months
  best_decile: 10
  measures: ["payoff_var", "payoff_scaled", "vol_spread_pts"]   # Test 1
  shape_measures: ["payoff_var", "payoff_scaled"]                # Tests 2, 3, 5
  robustness_window: 22          # H = 22 trading days (≈ 30 calendar days)
  bootstrap:
    method: "circular block"     # resamples blocks of consecutive months (keeps autocorrelation)
    block_length: 6              # months
    n_resamples: 10000
    seed: 20261122
  permutation:
    n_resamples: 10000
    seed: 20261123
  outputs:
    variants: "monthly_variants.csv"   # written to paths.processed
    tables: "stats_tables.csv"         # written to paths.reports
    summary: "stats_summary.md"
    claims: "pitch_claims.md"

# ---------------------------------------------------------------------------
# Research section: realised-vol dynamics, premium by known-at-t conditions, time variation
# (src/vrp/research.py, `make research`). Tests are pre-registered in docs/research_plan.md.
# ---------------------------------------------------------------------------
research:
  ar_nw_lags: 6                  # Newey–West lags for the AR(1) of monthly log RV
  trend_nw_lags: 12              # log RV is very persistent, so more lags for its trend test
  adf_autolag: "AIC"             # lag selection for the augmented Dickey–Fuller test
  # Fixed bucket thresholds (known in advance, not sample quantiles, so no look-ahead).
  vix_thresholds: [15, 25]       # VIX level at t (vol points): <=15 / 15–25 / >25
  gap_thresholds: [0, 5]         # VIX − past 21-day realised vol at t (vol points)
  rolling_window_months: 60      # rolling mean of the scaled premium (chart only)
  outputs:
    rv_monthly: "rv_calendar_month.csv"   # written to paths.processed
    rv_by_year: "research_rv_by_year.csv" # written to paths.reports
    tables: "research_tables.csv"
    rolling: "research_rolling_premium.csv"
    summary: "research_summary.md"
    claims: "research_claims.md"

# ---------------------------------------------------------------------------
# Pitch deck (src/vrp/deck.py, `make deck`). Numbers are read from the generated tables.
# ---------------------------------------------------------------------------
deck:
  template: "deck/template/OAF_Slide_Template.pptx"
  output: "deck/VIX_pitch.pptx"
  title: "Is the VIX Too Pessimistic?"
  subtitle_lines:
    - "The S&P 500 variance risk premium, 1990–2025"
    - "Oxford Alpha Fund Quant Bootcamp | 2 December 2026"
  date_text: "Data: Jan 1990 – Dec 2025"
  footer_text: "S&P 500 Variance Risk Premium"
  agenda:
    - "What the VIX measures"
    - "Is the VIX pessimistic? Evidence from 1990–2025"
    - "A fair price for the VIX"
    - "Trading the premium: strategy and backtest"
    - "Verdict"

